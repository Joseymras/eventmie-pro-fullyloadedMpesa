name: WaziEvents cPanel release

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql, pdo_sqlite, gd, intl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run prod
      - run: php artisan test
      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - name: Package cPanel release
        run: |
          zip -r wazievents-release.zip . \
            -x './.git/*' \
               './.env' \
               './.env.backup' \
               './.env.testing' \
               './node_modules/*' \
               './tests/*' \
               './.phpunit.result.cache' \
               './storage/logs/*'
      - uses: actions/upload-artifact@v4
        with:
          name: wazievents-release.zip
          path: wazievents-release.zip
          if-no-files-found: error
          retention-days: 30
